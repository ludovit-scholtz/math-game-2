name: math_game_2
description: A fun math game for 2nd grade elementary students to practice +, -, x and / under 100.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.0.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^23.0.2
  flutter_timezone: ^5.1.1
  material_ui: ^1.2.0
  shared_preferences: ^2.2.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/math_master_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/pets/
    - assets/sounds/
    - docs/privacy-policy/
