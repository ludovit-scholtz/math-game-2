name: math_game_2
description: A fun math game for 2nd grade elementary students to practice +, -, x and / under 100.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.0.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^23.0.2
  flutter_timezone: ^5.1.1
  material_ui: ^1.2.0
  shared_preferences: ^2.2.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Only for tool/screenshots (writes the store screenshots as PNG files).
  image: ^4.13.1

# Launcher icons for every platform come from the one image below. The
# platform folders are generated by `flutter create` (with the Flutter logo),
# so CI replaces the icons and then checks that none of the template icons is
# left (tool/check_launcher_icons.py). Android and iOS are configured here,
# web and Windows in tool/icons/*.yaml. Never add a file named
# `flutter_launcher_icons-<name>.yaml` to the project root: it is a "flavor"
# and makes the tool ignore this section.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/math_master_icon.png
  min_sdk_android: 21
  # Android 8+ shows the adaptive icon. Without it the launcher shrinks the
  # legacy icon onto a white plate. With this inset the picture fills a
  # squircle mask; a round mask trims only its corners (not the rocket or the
  # number tiles). The background colour fills whatever the picture leaves.
  adaptive_icon_background: "#BFE3F7"
  adaptive_icon_foreground: assets/icons/math_master_icon.png
  adaptive_icon_foreground_inset: 20
  # The App Store rejects icons with transparency.
  remove_alpha_ios: true
  background_color_ios: "#BFE3F7"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/pets/
    - assets/sounds/
    - docs/privacy-policy/
