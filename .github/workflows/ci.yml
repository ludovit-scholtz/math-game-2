name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform folders
        run: flutter create --platforms=android,ios,web --org io.biatec --project-name math_master .

      - name: Remember the Flutter template icons
        run: python tool/check_launcher_icons.py snapshot android ios

      - name: Update generated app metadata
        run: |
          python - <<'PY'
          import json
          import plistlib
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          manifest_text = re.sub(
            r'android:label="[^"]+"',
            'android:label="Math Master"',
            manifest_text,
            count=1,
          )
          notification_permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if notification_permission not in manifest_text:
              manifest_text = manifest_text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    '
                  + notification_permission,
                  1,
              )
          manifest.write_text(manifest_text)

          build_gradle = Path("android/app/build.gradle.kts")
          build_gradle_text = build_gradle.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in build_gradle_text:
              build_gradle_text = build_gradle_text.replace(
                  "    compileOptions {\n",
                  "    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n",
                  1,
              )
          if "coreLibraryDesugaring(" not in build_gradle_text:
              build_gradle_text += (
                  "\ndependencies {\n"
                  "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n"
                  "}\n"
              )
          # flutter_local_notifications 23 needs compileSdk 37 or later.
          build_gradle_text = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 37",
              build_gradle_text,
              count=1,
          )
          build_gradle.write_text(build_gradle_text)

          info_plist = Path("ios/Runner/Info.plist")
          with info_plist.open("rb") as file:
              plist = plistlib.load(file)
          plist["CFBundleDisplayName"] = "Math Master"
          plist["CFBundleName"] = "Math Master"
          with info_plist.open("wb") as file:
              plistlib.dump(plist, file)

          web_manifest = Path("web/manifest.json")
          if web_manifest.exists():
              manifest_json = json.loads(web_manifest.read_text())
              manifest_json["name"] = "Math Master"
              manifest_json["short_name"] = "Math Master"
              web_manifest.write_text(
                  json.dumps(manifest_json, indent=2, ensure_ascii=False) + "\n"
              )

          web_index = Path("web/index.html")
          if web_index.exists():
              web_index.write_text(
                re.sub(
                  r"<title>.*?</title>",
                  "<title>Math Master</title>",
                  web_index.read_text(),
                  count=1,
                )
              )
          PY

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Check that no Flutter template icon is left
        run: python tool/check_launcher_icons.py verify android ios

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-masters-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: math-masters-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform folders
        run: flutter create --platforms=web --org io.biatec --project-name math_master .

      - name: Remember the Flutter template icons
        run: python tool/check_launcher_icons.py snapshot web

      - name: Update generated web metadata
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          web_manifest = Path("web/manifest.json")
          if web_manifest.exists():
              manifest_json = json.loads(web_manifest.read_text())
              manifest_json["name"] = "Math Master"
              manifest_json["short_name"] = "Math Master"
              web_manifest.write_text(
                  json.dumps(manifest_json, indent=2, ensure_ascii=False) + "\n"
              )

          web_index = Path("web/index.html")
          if web_index.exists():
              web_index.write_text(
                re.sub(
                  r"<title>.*?</title>",
                  "<title>Math Master</title>",
                  web_index.read_text(),
                  count=1,
                )
              )
          PY

      - name: Generate web icons
        run: dart run flutter_launcher_icons -f tool/icons/web.yaml

      - name: Check that no Flutter template icon is left
        run: python tool/check_launcher_icons.py verify web

      - name: Build web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: math-masters-web
          path: build/web
          if-no-files-found: error

  store-screenshots:
    name: Store screenshots (${{ matrix.locale }})
    runs-on: ubuntu-latest
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        # Every language of the app (tool/screenshots/captions.dart).
        locale: [cs, de, en, es, fr, ja, ko, ru, sk, tr, zh]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Renders the real screens headlessly in every size the stores ask for
      # (see docs/SCREENSHOTS.md). Download the artifacts to upload them.
      - name: Generate store screenshots
        run: python tool/screenshots/generate_all.py --locales ${{ matrix.locale }}

      - name: Upload store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ matrix.locale }}
          path: docs/screenshots/${{ matrix.locale }}
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform folders
        run: flutter create --platforms=windows --org io.biatec --project-name math_master .

      - name: Remember the Flutter template icons
        shell: bash
        run: python tool/check_launcher_icons.py snapshot windows

      - name: Apply Windows app metadata
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          main_cpp = Path("windows/runner/main.cpp")
          main_cpp.write_text(
              main_cpp.read_text().replace('L"math_master"', 'L"Math Master"', 1)
          )

          rc = Path("windows/runner/Runner.rc")
          text = rc.read_text()
          for key in ("FileDescription", "ProductName"):
              text = re.sub(
                  r'(VALUE "%s", )"math_master"' % key,
                  r'\1"Math Master"',
                  text,
                  count=1,
              )
          rc.write_text(text)
          PY

      - name: Generate Windows icon
        run: dart run flutter_launcher_icons -f tool/icons/windows.yaml

      - name: Check that no Flutter template icon is left
        shell: bash
        run: python tool/check_launcher_icons.py verify windows

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: math-masters-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
